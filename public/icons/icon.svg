<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#022c22" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />

  <!-- Inner Soft Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#34d399" stroke-width="6" stroke-opacity="0.3" />

  <!-- Medical Cross / Ayush Symbol Symbolism -->
  <g filter="url(#shadow)">
    <!-- Central Pill Container -->
    <circle cx="256" cy="256" r="140" fill="#ffffff" />
    
    <!-- Emerald Clinical Cross -->
    <rect x="232" y="156" width="48" height="200" rx="20" fill="#047857" />
    <rect x="156" y="232" width="200" height="48" rx="20" fill="#047857" />
    
    <!-- Central Vitality Pulse Dot -->
    <circle cx="256" cy="256" r="16" fill="#ffffff" />
  </g>
</svg>
